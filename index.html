<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조민수</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0f9ff; /* 차분한 하늘색 느낌 */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #0369a1; text-align: center; margin-bottom: 20px; }
        .letter {
            font-size: 17px;
            line-height: 1.8;
            color: #334155;
            margin-bottom: 30px;
        }
        .photo {
            width: 100%;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
        }
        .footer {
            text-align: center;
            font-weight: bold;
            color: #0369a1;
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>민수야</h1>
        <div class="letter">
            <p>민수야, 우리처음만날때 생각나? 너 완젼 백수같았는데</p>
            <p>만난지는 얼마 되지도 안됬는데 아기도 생기고 결혼할라하니까 기분이 싱숭맹숭하네</p>
            <p>나너 맨날 바보같이 놀려도 사랑하니까 우리 세상이 이쁘게 키워보자</p>
            <p>사랑해, 조민수</p>
        </div>

        <img src="IMG_8799.jpeg" alt="우리 아기" class="photo">
        
        <div class="footer">
            <p>우리, 세상이 잘 키워보자! 사랑해! ❤️</p>
        </div>
    </div>

</body>
</html>
