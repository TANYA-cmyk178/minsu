<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 아기에게 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #fdf6e3;
      --warm: #f5e6c8;
      --brown: #7a5c3a;
      --light-brown: #b89060;
      --ink: #3a2a18;
    }

    html, body {
      width: 100%; height: 100%;
      background: #e8dcc8;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Nanum Myeongjo', serif;
      overflow: hidden;
    }

    .scene {
      width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    .envelope-wrap {
      position: relative;
      width: 340px;
      animation: floatUp 1s ease forwards;
    }
    @keyframes floatUp {
      from { opacity:0; transform: translateY(40px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .envelope {
      width: 340px; height: 220px;
      background: var(--warm);
      border-radius: 4px;
      position: relative;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      cursor: pointer;
      overflow: visible;
    }

    .envelope::before {
      content: '';
      position: absolute; top: 0; left: 0;
      width: 0; height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-top: 110px solid #e8d4a8;
      z-index: 3;
    }
    .envelope::after {
      content: '';
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 170px solid transparent;
      border-right: 170px solid transparent;
      border-bottom: 100px solid #dcc890;
      z-index: 1;
    }
    .env-left {
      position: absolute; bottom: 0; left: 0;
      width: 0; height: 0;
      border-bottom: 220px solid #d4b878;
      border-right: 170px solid transparent;
      z-index: 1;
    }
    .env-right {
      position: absolute; bottom: 0; right: 0;
      width: 0; height: 0;
      border-bottom: 220px solid #c8a85a;
      border-left: 170px solid transparent;
      z-index: 1;
    }

    .seal {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 52px; height: 52px;
      background: radial-gradient(circle at 40% 35%, #e87070, #c03030);
      border-radius: 50%;
      z-index: 4;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .open-hint {
      text-align: center;
      margin-top: 18px;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 18px;
      color: var(--brown);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity:0.6; } 50% { opacity:1; }
    }

    .page {
      display: none;
      position: absolute;
      width: 100vw; height: 100vh;
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .page.active { display: flex; }

    .letter-paper {
      position: relative;
      width: min(520px, 92vw);
      background: var(--cream);
      border-radius: 2px;
      padding: 48px 44px 40px;
      box-shadow: 0 12px 48px rgba(0,0,0,0.2), inset 0 0 0 1px rgba(0,0,0,0.04);
      animation: slideIn 0.5s ease forwards;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes slideIn {
      from { opacity:0; transform: scale(0.92) translateY(20px); }
      to   { opacity:1; transform: scale(1) translateY(0); }
    }

    .letter-paper::before {
      content: '';
      position: absolute; inset: 60px 0 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px, transparent 31px,
        #e0d4b0 31px, #e0d4b0 32px
      );
      pointer-events: none;
    }

    .letter-paper::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      left: 68px;
      width: 1px;
      background: rgba(200,80,80,0.35);
      pointer-events: none;
    }

    .close-btn {
      position: absolute;
      top: 14px; right: 16px;
      width: 32px; height: 32px;
      border: none; background: none;
      font-size: 22px; color: var(--light-brown);
      cursor: pointer; line-height: 1;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s;
      z-index: 10;
    }
    .close-btn:hover { background: rgba(0,0,0,0.06); color: var(--brown); }

    .letter-date {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 15px;
      color: var(--light-brown);
      margin-bottom: 20px;
      position: relative; z-index: 1;
    }
    .letter-body {
      font-family: 'Nanum Pen Script', cursive;
      font-size: 21px;
      line-height: 32px;
      color: var(--ink);
      position: relative; z-index: 1;
      white-space: pre-line;
    }
    .letter-sign {
      margin-top: 28px;
      text-align: right;
      font-family: 'Nanum Pen Script', cursive;
      font-size: 19px;
      color: var(--brown);
      position: relative; z-index: 1;
    }

    .next-btn {
      margin-top: 20px;
      padding: 12px 36px;
      background: var(--brown);
      color: #fff;
      border: none;
      border-radius: 40px;
      font-family: 'Nanum Myeongjo', serif;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transition: transform 0.2s, background 0.2s;
    }
    .next-btn:hover { background: #5c3d1e; transform: translateY(-2px); }

    #page-photo {
      background: radial-gradient(ellipse at center, #1a0a0a 0%, #000 100%);
    }

    .photo-frame {
      display: flex; flex-direction: column; align-items: center;
      gap: 28px;
      animation: fadeInPhoto 0.8s ease forwards;
    }
    @keyframes fadeInPhoto {
      from { opacity:0; transform: scale(0.95); }
      to   { opacity:1; transform: scale(1); }
    }

    .photo-frame img
