<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>whalstn</title>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f0f9ff; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        h1 { color: #0369a1; text-align: center; margin-bottom: 25px; }
        .letter { font-size: 17px; line-height: 1.8; color: #334155; margin-bottom: 20px; }
        .photo { width: 100%; border-radius: 20px; display: block; }
        .video-container { margin: 25px 0; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .footer { text-align: center; font-weight: bold; color: #e11d48; margin-top: 20px; font-size: 19px; }
    </style>
</head>
<body>

    <div class="card">
        <h1>민수야</h1>
        <div class="letter">
            <p>여보, 우리에게 찾아온 이 작은 선물 덕분에 매일이 설레요. 우리 아기 세상에서 가장 행복한 아이로 같이 잘 키워봐요!</p>
        </div>

        <!-- 아기 사진 -->
        <img src="IMG_8799.jpeg" alt="우리 아기집" class="photo">
        
        <!-- 마무리 문구 -->
        <div class="footer">
            <p>우리, 세상이 잘 키워보자! 사랑해! ❤️</p>
        <!-- 유튜브 영상 -->
        <div class="video-container">
            <iframe width="100%" height="250" src="https://www.youtube.com/embed/L7cAqBQVjYI" frameborder="0" allowfullscreen></iframe>

        </div>
    </div>

</body>
</html>
